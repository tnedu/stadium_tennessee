# change 'edu_project_template' everywhere it appears in this document 
# to match your project's name
name: 'stadium_tennessee'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'stadium_tennessee'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

on-run-end: "{% if target.name == 'prod' %}{{ dbt_artifacts.upload_results(results) }}{% endif %}"

flags:
  # We cannot make this True until EA changes how their post_hook stuff works in the warehouse models
  use_materialization_v2: False
  require_ref_searches_node_package_before_root: True

models:
  edu_wh:
    build:
      +materialized: table
      +schema: build
      edfi_3:
        students:
          bld_ef3__wide_ids_student:
            +enabled: False
    core_warehouse:
      +materialized: table
      +schema: wh
  dbt_artifacts:
    +schema: dbt_run__audit
    +tags: ['bypass_rls']

vars:
  # All of these are enrollment vars that impact how data shows in fct_student_school_association
  # keep no shows who exit before the first day of school
  'edu:enroll:exclude_exit_before_first_day': False
  # inclusiveness of enrollment exit withdraw date
  'edu:enroll:exit_withdraw_date_inclusive': False
  # if the student exits on the first day of school, they are not considered a valid enrollment
  'edu:enroll:first_day_exit_date_inclusive': False
  # withdraw codes that should exclude students from enrollment altogether
  'edu:enroll:exclude_withdraw_codes': ['No show', 'Invalid enrollment']
  # will remove enrollments if its school year doesn't match the school year on dim_student
  'edu:enroll:exclude_cross_year_enrollments': False
  # Will allow an enrollment to remain after the exit date by the number of days set.
  'edu:enroll:year_end_active_buffer_days': 0

  # labels for generated race/ethnicity groups
  'edu:stu_demos:multiple_races_code': Multiple
  'edu:stu_demos:hispanic_latino_code': Latinx
  'edu:stu_demos:race_unknown_code': Unknown

  # rules for inclusion in program associations
  # Begin and end dates to use for cutoffs, and a list of program names to exclude
  'edu:homeless:start_date_column': program_enroll_begin_date
  'edu:homeless:exit_date_column': program_enroll_end_date
  'edu:homeless:exclude_programs': Null
  'edu:homeless:agg_types': ['annual', 'active']

  'edu:language_instruction:start_date_column': program_enroll_begin_date
  'edu:language_instruction:exit_date_column': program_enroll_end_date
  'edu:language_instruction:exclude_programs': Null
  'edu:language_instruction:agg_types': ['annual', 'active']

  'edu:special_ed:start_date_column': program_enroll_begin_date
  'edu:special_ed:exit_date_column': program_enroll_end_date
  'edu:special_ed:exclude_programs': Null
  'edu:special_ed:agg_types': ['annual', 'active']

  'edu:title_i:start_date_column': program_enroll_begin_date
  'edu:title_i:exit_date_column': program_enroll_end_date
  'edu:title_i:exclude_programs': Null
  'edu:title_i:agg_types': ['annual', 'active']

  'edu:cte:start_date_column': program_enroll_begin_date
  'edu:cte:exit_date_column': program_enroll_end_date
  'edu:cte:exclude_programs': Null
  'edu:cte:agg_types': ['annual', 'active']

  'edu:food_service:start_date_column': program_enroll_begin_date
  'edu:food_service:exit_date_column': program_enroll_end_date
  'edu:food_service:exclude_programs': Null
  'edu:food_service:agg_types': ['annual', 'active']

  'edu:migrant_education:start_date_column': program_enroll_begin_date
  'edu:migrant_education:exit_date_column': program_enroll_end_date
  'edu:migrant_education:exclude_programs': Null
  'edu:migrant_education:agg_types': ['annual', 'active']

  'edu:section_504:start_date_column': program_enroll_begin_date
  'edu:section_504:exit_date_column': program_enroll_end_date
  'edu:section_504:exclude_programs': Null
  'edu:section_504:agg_types': ['annual', 'active']

  'edu:neglected_or_delinquent:start_date_column': program_enroll_begin_date
  'edu:neglected_or_delinquent:exit_date_column': program_enroll_end_date
  'edu:neglected_or_delinquent:exclude_programs': Null
  'edu:neglected_or_delinquent:agg_types': ['annual', 'active']

  # label for 'Present' days generated from negative attendance
  'edu:attendance:in_attendance_code': In Attendance
  # threshold and minimum enrolled days for chronic absence definition
  'edu:attendance:chronic_absence_threshold': 90
  'edu:attendance:chronic_absence_min_days': 20

  # student discipline participation codes that map to non-offenders
  'edu:discipline:non_offender_codes': ['Victim', 'Witness', 'Reporter']

  # custom intersections of other demographic groupings
  'edu:stu_demos:intersection_groups': Null

  #tdoe business rule vars
  'tdoe:status_columns_config':
    columns:
      tdoe_severity_code: 0
      tdoe_severity: "'good'"
    statuses:
      good: 0
      info: 1
      warning: 2
      error: 3
      critical: 4
      potential: 9

  # source config
  extensions:
    stg_ef3__students:
      state_student_id:
        name: 'tdoe:stateStudentId'
        dtype: 'bigint'
    stg_ef3__student_school_associations:
      studentStandardDays:
        name: 'tdoe:studentStandardDays'
        dtype: 'array<struct<effectiveDate:date, studentStandardDayDuration:int>>'
    stg_ef3__student_education_organization_associations:
      dateEnteredUS:
        name: 'tdoe:dateEnteredUS'
        dtype: 'date'

  descriptors:
    exitWithdrawTypeDescriptor:
      replace_with: "concat(code_value,': ',short_description)"
    attendanceEventCategoryDescriptor:
      replace_with: short_description
    calendarEventDescriptor:
      replace_with: "concat(code_value,': ',short_description)"
    diplomaTypeDescriptor:
      replace_with: "concat(code_value,': ',short_description)"
  
  # Enable optional domains and programs
  'src:domain:assessment:enabled': False
  'src:domain:cohort:enabled': True
  'src:domain:discipline:enabled': True
  'src:ed_orgs:esc:enabled': True
  'src:program:cte:enabled': False
  'src:program:homeless:enabled': True
  'src:program:language_instruction:enabled': True
  'src:program:migrant_education:enabled': False
  'src:program:neglected_or_delinquent:enabled': False
  'src:program:food_service:enabled': False
  'src:program:section_504:enabled': False
  'src:program:special_ed:enabled': True
  'src:program:title_i:enabled': False
  'src:domain:survey:enabled': False
  
  # Data validation vars
  'edu:data_validation':
    enabled: True
    include_validator_name: True
    include_validator_application: True
    propagate_validations: True
    #default_severity: "null"
    severities:
      info: 1
      warning: 2
      error: 3
      critical: 4
    additional_fields: {}
    models:
      stg_ef3__calendars:
        - val__1000_not_enough_instructional_days
        - val__1004_required_calendar_events
      dim_school:
        - val__9999_fake_dim_school_rule
      dim_lea:
        - val__9998_fake_dim_lea_rule
  
  'edu:calendar_date:custom_data_sources':
    cds_calendar_date_report_periods:
      report_period:
        where: report_period
      day_of_report_period:
        where: day_of_report_period
      school_day_of_report_period:
        where: school_day_of_report_period
      report_period_begin_date:
        where: report_period_begin_date
      report_period_end_date:
        where: report_period_end_date
      days_in_report_period:
        where: days_in_report_period
      school_days_in_report_period:
        where: school_days_in_report_period
  
  'edu:stu_demos:custom_data_sources': 
    cds_student_additional_columns:
      state_student_id:
        where: stateStudentId
      date_entered_us:
        where: cds_date_entered_us

  'edu:discipline_actions:custom_data_sources':
    cds_student_discipline_action_additional_columns:
      discipline_end_date:
        where: discipline_end_date
  
  'edu:course_section:custom_data_sources':
    cds_courses_course_level_characteristics:
      is_cte:
        where: is_cte
      EPSOIdentification:
        where: EPSOIdentification
      CTE_Cluster:
        where: CTE_Cluster
seeds:
  +schema: seed
  +quote_columns: false
